# Render Blueprint: one free Docker web service running the API and the built React app.
# Deploy: Render dashboard > New > Blueprint > pick this repository > Apply.
services:
  - type: web
    name: acme-salary
    runtime: docker
    plan: free
    autoDeploy: true            # every push to the default branch redeploys
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true     # a random secret, created once by Render and kept out of git
      - key: HR_USERNAME
        value: hr
      # Public on purpose: this is a demo with synthetic data, and the login page shows the same credentials.
      # For real data, remove this value, set HR_PASSWORD in the dashboard, and rebuild with VITE_SHOW_DEMO_LOGIN=false.
      - key: HR_PASSWORD
        value: acme-hr-2026
